services:
  - type: web
    name: vera-beta
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: HOST
        value: 0.0.0.0
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CHAT_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_SPEECH_MODEL
        value: whisper-large-v3-turbo
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_VISION_MODEL
        value: gemini-4-hydrogen
      - key: GEMINI_DEEP_MODEL
        value: gemini-4-argon
      - key: GEMINI_TTS_MODEL
        value: gemini-3.8-flash-lite-tts
      - key: GEMINI_TTS_VOICE
        value: Kore
      - key: VERA_ALLOW_LEGACY_OWNER_FILE
        value: 'false'
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: VERA_ADMIN_SECRET
        generateValue: true
      - key: VERA_OWNER_EMAIL
        value: saiopilatestudio@gmail.com
      - key: VERA_OWNER_PASSWORD
        sync: false
