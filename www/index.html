<!doctype html>
<html lang="es">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  /><meta name="theme-color" content="#f6f5ed" /><title>
    Vera · Entrenamiento
  </title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #f6f5ed;
      color: #172b20;
      font:
        16px/1.48 system-ui,
        sans-serif;
    }
    main,
    header,
    nav {
      max-width: 620px;
      margin: auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: calc(22px + env(safe-area-inset-top)) 22px 10px;
    }
    header strong {
      font: bold 32px Georgia;
    }
    main {
      padding: 0 22px 120px;
    }
    h1,
    h2,
    h3 {
      font-family: Georgia, serif;
      line-height: 1.1;
    }
    h1 {
      font-size: 48px;
      margin: 20px 0;
    }
    h2 {
      font-size: 27px;
    }
    h3 {
      font-size: 21px;
      margin: 6px 0;
    }
    section,
    details,
    article {
      border: 1px solid #d6d9c9;
      border-radius: 17px;
      padding: 17px;
      background: #fffef8;
      margin: 12px 0;
    }
    article {
      background: #123623;
      color: #f9f9e9;
      padding: 22px;
    }
    article small {
      color: #bded66;
    }
    button,
    input,
    textarea,
    select {
      font: inherit;
    }
    button {
      color: #173222;
      background: #e4e9d8;
      border: 0;
      border-radius: 13px;
      padding: 11px 15px;
      cursor: pointer;
      margin: 3px 3px 3px 0;
    }
    button:disabled {
      opacity: 0.55;
    }
    .primary {
      background: #c8f264;
      font-weight: 650;
    }
    input,
    textarea,
    select {
      width: 100%;
      padding: 11px;
      border-radius: 10px;
      border: 1px solid #b7c1ad;
      background: white;
      color: #152b1d;
    }
    textarea {
      min-height: 78px;
    }
    label {
      display: block;
      margin: 10px 0;
      font-weight: 600;
    }
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #f6f5ed;
      border-top: 1px solid #bec7b6;
      display: flex;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      justify-content: space-around;
    }
    nav button {
      background: transparent;
      font-size: 14px;
    }
    nav .on {
      background: #d6efa6;
    }
    summary {
      font-weight: 650;
      cursor: pointer;
    }
    small,
    .sub {
      color: #53634e;
    }
    .pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 14px;
    }
    td,
    th {
      text-align: left;
      padding: 8px 3px;
      border-bottom: 1px solid #dde1d2;
    }
    .note {
      position: sticky;
      top: 4px;
      background: #fcf1c8;
      border-radius: 10px;
      padding: 10px;
      z-index: 2;
    }
    .note:empty {
      display: none;
    }
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    p {
      margin: 8px 0 14px;
    }
    .bar {
      height: 5px;
      background: #629144;
      border-radius: 3px;
    }
    small {
      display: block;
    }
    button:focus-visible {
      outline: 3px solid #24844b;
    }
  </style>
  <style>
    :root {
      --paper: #f8f5ec;
      --ink: #142f23;
      --lime: #c5ec76;
    }
    body {
      background: var(--paper);
      color: var(--ink);
      max-width: 100%;
      overflow-x: hidden;
    }
    header {
      background: var(--paper);
      max-width: 680px;
      border-bottom: 1px solid #dce0cf;
      padding: 16px 22px;
    }
    header strong {
      font: 700 39px/0.95 Georgia;
      letter-spacing: -2px;
    }
    header button {
      background: transparent;
      font-size: 14px;
    }
    main {
      max-width: 680px;
      padding: 10px 20px 105px;
    }
    h1 {
      letter-spacing: -1.8px;
      font-weight: 500;
    }
    section,
    details {
      box-shadow: none;
    }
    nav {
      background: #fffcf4;
      max-width: 680px;
      border-radius: 18px 18px 0 0;
      border: 1px solid #dce0cf;
      bottom: 0;
      padding: 6px 4px max(7px, env(safe-area-inset-bottom));
      z-index: 4;
    }
    nav button {
      margin: 0;
      min-width: 60px;
      display: grid;
      justify-items: center;
      gap: 1px;
      font-size: 12px;
      padding: 5px 11px;
    }
    nav b {
      font: 23px Georgia;
    }
    .gate,
    .welcome {
      padding: 24px 3px;
    }
    .gate {
      max-width: 440px;
      margin: auto;
    }
    .gate h1,
    .welcome h1 {
      font-size: clamp(38px, 8vw, 57px);
      margin: 16px 0 10px;
    }
    .gate .primary {
      display: block;
      width: 100%;
      margin: 18px 0 8px;
    }
    .emblem {
      display: grid;
      place-items: center;
      background: #193c2b;
      color: #cbef87;
      width: 53px;
      height: 53px;
      border-radius: 16px;
      font: italic 38px Georgia;
    }
    .gate > p,
    .welcome p {
      color: #516052;
    }
    .check {
      font-size: 14px;
    }
    .check input {
      display: inline;
      width: auto;
    }
    .welcome {
      text-align: left;
      padding: 40px 6px 18px;
    }
    .composer {
      border: 1px solid #c5cfba;
      border-radius: 23px;
      background: #fffef8;
      padding: 12px;
    }
    .composer label {
      font-size: 0;
      margin: 0;
    }
    .composer textarea {
      border: none;
      background: transparent;
      resize: vertical;
      font: 17px/1.5 system-ui;
      min-height: 72px;
    }
    .composer button {
      border-radius: 25px;
    }
    .thread {
      border: 0;
      background: transparent;
      margin: 0;
      padding: 8px 0;
    }
    .thread > small {
      display: none;
    }
    .thread > p:first-of-type {
      background: #e8ecdd;
      border-radius: 19px 19px 4px 19px;
      margin: 10px 0 19px auto;
      padding: 12px 16px;
      width: fit-content;
      max-width: 86%;
    }
    .thread > h3 {
      font-size: 23px;
    }
    .thread > button {
      font-size: 13px;
      background: transparent;
      border: 1px solid #c9d2c1;
    }
    .shutter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 15px;
      position: relative;
      overflow: hidden;
      border-radius: 13px;
      background: #173d29;
      color: #fff;
      cursor: pointer;
    }
    .shutter.light {
      background: #e8ecde;
      color: #173d29;
    }
    .shutter input {
      position: absolute;
      inset: 0;
      opacity: 0;
      width: 100%;
      cursor: pointer;
    }
    .heroimg {
      display: block;
      width: 100%;
      height: 108px;
      object-fit: cover;
      object-position: center 38%;
      border-radius: 17px;
    }
    button.primary {
      background: var(--lime);
      color: #142f23;
    }
    .note {
      position: relative;
      top: auto;
    }
    .gate form input {
      font-size: 16px;
    }
    .cameraShortcut {
      display: flex;
      gap: 8px;
      align-items: center;
      font-weight: 600;
    }
    .cameraShortcut svg {
      width: 20px;
      height: 20px;
    }
  </style>

  <header>
    <strong>Vera</strong>
    <div id="topTools" class="row">
      <button class="cameraShortcut" onclick="go('Cámara')">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M3 7h4l2-3h6l2 3h4v13H3z" />
          <circle cx="12" cy="13" r="3" /></svg
        >Cámara</button
      ><button onclick="go('Perfil')">Perfil</button>
    </div>
  </header>
  <main>
    <div class="note" role="status" id="notice"></div>
    <div id="view"></div>
  </main>
  <nav id="nav"></nav>
  <script>
    const $ = (id) => document.getElementById(id);
    const safe = (s) =>
      String(s ?? "").replace(
        /[&<>"']/g,
        (c) =>
          ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          })[c],
      );
    const day = (d = new Date()) =>
      [
        d.getFullYear(),
        String(d.getMonth() + 1).padStart(2, "0"),
        String(d.getDate()).padStart(2, "0"),
      ].join("-");
    const initial = () => ({
      profile: {},
      logs: [],
      turns: [],
      plan: "",
      memory: [],
      endpoint: "",
    });
    let s =
      JSON.parse(
        localStorage.getItem(storageKey()) ||
          (!sessionStorage.veraUser && localStorage.getItem("vera.v1")) ||
          "null",
      ) || initial();
    let tab = s.profile.name ? "Hoy" : "Perfil",
      period = 7,
      kind = "Entrenamiento",
      metric = "Peso en ayunas",
      photoData = "",
      busy = false,
      recording = null;
    const units = {
      Entrenamiento: "",
      Comida: "kcal",
      Bebida: "ml",
      Agua: "ml",
      Suplemento: "",
      "Peso en ayunas": "kg",
      "Otro pesaje": "kg",
      Cintura: "cm",
      Sueño: "h",
      Pasos: "pasos",
      Cardio: "min",
      Posing: "min",
      Sensaciones: "",
    };
    const roles = [
      "Hipertrofia",
      "Nutrición deportiva",
      "Medicina deportiva",
      "Endocrinología",
      "Fisioterapia deportiva",
      "Posing",
      "Psicología deportiva",
      "Sueño y recuperación",
      "Maquinaria y biomecánica",
    ];
    function save() {
      markLogs();
      localStorage.setItem(storageKey(), JSON.stringify(s));
    }
    function msg(t) {
      $("notice").textContent = t;
    }
    function go(t) {
      if (!validSession) {
        render();
        return;
      }
      if (t === "Máquinas") {
        machineDraft = null;
        machinePhoto = "";
      }
      if (tab === "Posing" && t !== "Posing") poseStop();
      if (t === "Plato") {
        photoData = "";
        draft = null;
      }
      if (recording) {
        msg("Termina la grabación antes de cambiar de pantalla.");
        return;
      }
      tab = t;
      msg("");
      render();
      scrollTo(0, 0);
    }
    function btn(t, fn, primary = false) {
      return (
        '<button class="' +
        (primary ? "primary" : "") +
        '" onclick="' +
        fn +
        '">' +
        t +
        "</button>"
      );
    }
    function field(id, label, value = "", type = "text", attrs = "") {
      return (
        "<label>" +
        label +
        '<input id="' +
        id +
        '" type="' +
        type +
        '" value="' +
        safe(value) +
        '" ' +
        attrs +
        "></label>"
      );
    }
    function options(items, selected) {
      return items
        .map(
          (x) =>
            "<option " +
            (x === selected ? "selected" : "") +
            ">" +
            safe(x) +
            "</option>",
        )
        .join("");
    }
    function render() {
      $("topTools").style.display = validSession ? "flex" : "none";
      $("nav").style.display = validSession ? "flex" : "none";
      if (!validSession) {
        $("view").innerHTML = gate();
        return;
      }
      $("nav").innerHTML = ["Chat", "Hoy", "Equipo", "Progreso"]
        .map(
          (t) =>
            '<button class="' +
            (t === tab ? "on" : "") +
            '" onclick="go(\'' +
            t +
            '\')"><b aria-hidden="true">' +
            icons[t] +
            "</b>" +
            t +
            "</button>",
        )
        .join("");
      const pages = {
        Chat: convo,
        Hoy: home,
        Equipo: team,
        Progreso: progress,
        Perfil: profile,
        Registro: entry,
        Plato: plate,
        Descanso: sleepPage,
        Sensaciones: checkPage,
        Posing: posePage,
        Máquinas: machinePage,
        Cámara: cameraPicker,
      };
      $("view").innerHTML =
        (tab === "Chat" ? "" : "<h1>" + safe(tab) + "</h1>") +
        (pages[tab] || convo)();
      if (tab === "Chat")
        for (const section of $("view").querySelectorAll("section"))
          if (section.firstElementChild?.textContent === "TÚ")
            section.classList.add("thread");
    }
    function profile() {
      let p = s.profile;
      return (
        '<form onsubmit="storeProfile(event)"><section><h2>Tu punto de partida</h2>' +
        field(
          "name",
          "Cómo te llamas",
          p.name,
          "text",
          'required maxlength="80"',
        ) +
        field("age", "Edad", p.age, "number", 'required min="18" max="110"') +
        field(
          "height",
          "Altura (cm)",
          p.height,
          "number",
          'min="80" max="250" step=".1"',
        ) +
        field(
          "weight",
          "Peso inicial (kg)",
          p.weight,
          "number",
          'min="25" max="350" step=".1"',
        ) +
        field(
          "goal",
          "Tu objetivo",
          p.goal || "Ganar músculo limitando la ganancia de grasa",
          "text",
          "required",
        ) +
        field("criteria", "Días, material y experiencia", p.criteria) +
        field("likes", "Gustos, horarios y restricciones", p.likes) +
        '<label><input type="checkbox" style="width:auto" id="template" ' +
        (p.template ? "checked" : "") +
        '> Usar como referencia el bloque de hipertrofia de cuatro semanas</label><button class="primary">Guardar perfil</button></section></form><details><summary>Mi cuenta</summary>' +
        accountPanel() +
        "</details>" +
        gymPanel() +
        "<details><summary>Memoria editable</summary>" +
        field("expiry", "Válida hasta (opcional)", "", "date") +
        field("memory", "Instrucción que quieres conservar") +
        btn("Recordar", "remember()") +
        s.memory
          .map(
            (x, i) =>
              "<p>" +
              safe(x) +
              safe((s.expiry || {})[x] ? " · hasta " + s.expiry[x] : "") +
              " " +
              btn("Olvidar", "forget(" + i + ")") +
              "</p>",
          )
          .join("") +
        "</details><details><summary>Datos de salud</summary><p>Importa pasos, sueño y sesiones desde Salud de Apple o Health Connect al diario de este dispositivo.</p>" +
        btn("Importar desde el móvil", "syncHealth()") +
        "</details>"
      );
    }
    function storeProfile(e) {
      e.preventDefault();
      s.profile = Object.fromEntries(
        ["name", "age", "height", "weight", "goal", "criteria", "likes"].map(
          (k) => [k, $(k).value.trim()],
        ),
      );
      s.profile.template = $("template").checked;
      save();
      go("Hoy");
    }
    function connect() {
      try {
        let u = new URL($("endpoint").value || location.origin);
        if (
          u.protocol !== "https:" &&
          !["localhost", "127.0.0.1"].includes(u.hostname)
        )
          throw Error();
        s.endpoint = u.origin;
        sessionStorage.veraToken = $("token").value.trim();
        save();
        msg("Conexión guardada para tus consultas.");
      } catch {
        msg("Introduce la dirección HTTPS de tu servidor.");
      }
    }
    function remember() {
      let t = $("memory").value.trim();
      if (t && !s.memory.includes(t)) {
        s.memory.push(t);
        if ($("expiry")?.value) (s.expiry ??= {})[t] = $("expiry").value;
        save();
        render();
      }
    }
    function forget(i) {
      if (s.expiry) delete s.expiry[s.memory[i]];
      s.memory.splice(i, 1);
      save();
      render();
    }

    function homeCore() {
      let logs = s.logs.filter((l) => l.date === day());
      return (
        "<small>" +
        safe(
          new Date().toLocaleDateString("es-ES", {
            weekday: "long",
            day: "numeric",
            month: "long",
          }),
        ) +
        "</small><article><small>PLAN ACTUAL</small><h2>" +
        safe(
          s.profile.name ? "Tu sesión, " + s.profile.name : "Tu primera sesión",
        ) +
        '</h2><p class="pre">' +
        safe(
          s.plan ||
            "Define tu objetivo y pide a Vera la primera ficha de entrenamiento.",
        ) +
        "</p>" +
        btn(
          "Preparar mi sesión",
          "ask('Hoy. Prepara mi ficha y mi plan semanal según mi perfil.')",
          true,
        ) +
        "</article><section><h3>Diario de hoy</h3>" +
        btn("Añadir registro", "go('Registro')", true) +
        btn("Fotografiar plato", "go('Plato')") +
        logs
          .map(
            (l) =>
              logLine(l) +
              (recordFor(l) ? "<small>" + safe(recordFor(l)) + "</small>" : ""),
          )
          .join("") +
        (!logs.length
          ? '<p class="sub">Aún no has confirmado registros hoy.</p>'
          : "") +
        "</section><section><h3>Revisar el plan</h3>" +
        btn(
          "Semana",
          "ask('Revisión semanal. Compara mis dos últimas semanas y actualiza mi plan.')",
        ) +
        btn(
          "Bloque de 4 semanas",
          "ask('Revisión mensual. Evalúa mi último bloque y diseña las próximas cuatro semanas.')",
        ) +
        "</section>"
      );
    }
    function logLine(l) {
      return (
        "<p><b>" +
        safe(l.kind) +
        "</b> " +
        safe(l.value ?? "") +
        " " +
        safe(units[l.kind]) +
        "<small>" +
        safe(l.note) +
        " · " +
        safe(l.date) +
        "</small></p>"
      );
    }
    function entry() {
      return (
        '<form onsubmit="add(event)"><section><label>Tipo<select onchange="kind=this.value;render()">' +
        options(Object.keys(units), kind) +
        "</select></label>" +
        (kind === "Comida"
          ? macroFields()
          : kind === "Entrenamiento"
            ? trainingFields()
            : "") +
        field("date", "Fecha", day(), "date", 'required max="' + day() + '"') +
        (units[kind]
          ? field(
              "amount",
              "Cantidad (" + units[kind] + ")",
              "",
              "number",
              'min="0" step="any" ' + (kind === "Comida" ? "" : "required"),
            )
          : "") +
        (kind === "Entrenamiento"
          ? field("exercise", "Ejercicio", "", "text", "required") +
            field(
              "load",
              "Carga por repetición (kg)",
              "",
              "number",
              'required min="0" step="any"',
            ) +
            field(
              "reps",
              "Repeticiones en cada serie (p. ej. 12, 10, 10)",
              "",
              "text",
              'required pattern="[0-9 ,]+"',
            ) +
            field(
              "rir",
              "Repeticiones en reserva en la última serie",
              "",
              "number",
              'min="0" max="20"',
            )
          : "") +
        '<label>Detalle o sensaciones<textarea id="detail" ' +
        (["Suplemento", "Sensaciones", "Comida"].includes(kind)
          ? "required"
          : "") +
        '></textarea></label><button class="primary">Confirmar registro</button></section></form>'
      );
    }
    function add(e) {
      e.preventDefault();
      let l = {
        kind,

    function progressCore() {
      let end = new Date();
      end.setHours(0, 0, 0, 0);
      let from = new Date(end);
      from.setDate(end.getDate() - period + 1);
      let old = new Date(from);
      old.setDate(from.getDate() - period);
      const macroKey = { Proteína: "protein", Hidratos: "carbs", Grasa: "fat" }[
        metric
      ];
      let all = macroKey
        ? s.logs
            .filter(
              (x) =>
                x.kind === "Comida" &&
                x[macroKey] != null &&
                x[macroKey] !== "",
            )
            .map((x) => ({ ...x, value: +x[macroKey] }))
        : s.logs.filter((x) => x.kind === metric && x.value !== null);
      const unit = macroKey ? "g" : units[metric];
      function daily(rows) {
        if (metric === "Sueño") {
          const manual = new Set(
            rows.filter((l) => l.source !== "health").map((l) => l.date),
          );
          rows = rows.filter(
            (l) => l.source !== "health" || !manual.has(l.date),
          );
        }
        if (metric === "Pasos") {
          let imported = new Set(
            rows.filter((l) => l.source === "health").map((l) => l.date),
          );
          rows = rows.filter(
            (l) => l.source === "health" || !imported.has(l.date),
          );
        }
        let m = {};
        for (const l of rows) (m[l.date] ??= []).push(+l.value);
        return Object.entries(m)
          .map(([d, v]) => [
            d,
            v.reduce((a, b) => a + b, 0) /
              (["Peso en ayunas", "Cintura"].includes(metric) ? v.length : 1),
          ])
          .sort();
      }
      let now = daily(
          all.filter((x) => x.date >= day(from) && x.date <= day(end)),
        ),
        prev = daily(
          all.filter((x) => x.date >= day(old) && x.date < day(from)),
        );
      const avg = (rows) => rows.reduce((t, r) => t + r[1], 0) / rows.length;
      const peak = Math.max(1, ...now.map((x) => x[1]));
      return (
        '<section><label>Periodo<select onchange="period=Number(this.value);render()"><option value="7">7 días</option><option value="28" ' +
        (period === 28 ? "selected" : "") +
        '>28 días</option></select></label><label>Medida<select onchange="metric=this.value;render()">' +
        options(
          [
            "Peso en ayunas",
            "Cintura",
            "Comida",
            "Proteína",
            "Hidratos",
            "Grasa",
            "Agua",
            "Sueño",
            "Pasos",
            "Cardio",
          ],
          metric,
        ) +
        "</select></label><h3>" +
        safe(metric) +
        "</h3><p>" +
        now.length +
        " de " +
        period +
        " días con datos · " +
        (prev.length && now.length
          ? "Cambio de media diaria: " +
            (avg(now) - avg(prev)).toFixed(1) +
            " " +
            unit
          : "Sin dos periodos comparables.") +
        "</p><table><tr><th>Fecha</th><th>" +
        unit +
        "</th></tr>" +
        now
          .map(
            ([d, v]) =>
              "<tr><td>" +
              d +
              "</td><td>" +
              v.toFixed(1) +
              '<div class="bar" style="width:' +
              Math.round((100 * v) / peak) +
              '%"></div></td></tr>',
          )
          .join("") +
        "</table></section><section><h3>Marcas por sesión</h3>" +
        s.logs
          .filter((x) => x.exercise && x.date >= day(from))
          .map(
            (l) =>
              logLine(l) +
              (recordFor(l) ? "<small>" + safe(recordFor(l)) + "</small>" : ""),
          )
          .join("") +
        "</section><details><summary>Historial y correcciones</summary>" +
        s.logs
          .map(
            (l, i) =>
              logLine(l) +
              btn("Corregir", "editRecord(" + i + ")") +
              btn("Eliminar", "removeLog(" + i + ")"),
          )
          .join("") +
        "</details>"
      );
    }

    async function syncHealth() {
      if (window.VeraNative) {
        window.VeraNative.health();
        return;
      }
      try {
        let h = window.Capacitor?.Plugins?.Health;
        if (!h || (await h.isAvailable()).available !== true)
          throw Error(
            "Abre la versión nativa en un dispositivo con Salud o Health Connect.",
          );
        await h.requestAuthorization({
          read: ["steps", "workouts", "sleep"],
          write: [],
        });
        let start = new Date();
        start.setHours(0, 0, 0, 0);
        let range = {
          startDate: start.toISOString(),
          endDate: new Date().toISOString(),
        };
        let a = await h.queryAggregated({
          ...range,
          dataType: "steps",
          bucket: "day",
          aggregation: "sum",
        });
        let w = await h.queryWorkouts(range);
        const sleep = await h.readSamples({
          dataType: "sleep",
          startDate: new Date(+start - 86400000).toISOString(),
          endDate: range.endDate,
          limit: 1000,
        });
        const segments = sleep.samples
          .filter((x) =>
            ["asleep", "light", "deep", "rem", "core"].includes(x.sleepState),
          )
          .map((x) => [+new Date(x.startDate), +new Date(x.endDate), []])
          .filter((x) => x[1] > +start)
          .map(([a, b, c]) => [Math.max(a, +start), b, c]);
        let values = a.samples.map((x) => x.value);
        let imported = [];
        if (values.length)
          imported.push({
            kind: "Pasos",
            value: values.reduce((a, b) => a + b, 0),
            note: "Total del sistema",
          });
        for (let x of w.workouts)
          imported.push({
            kind: "Entrenamiento",
            note: x.workoutType + " · " + x.startDate,
          });
        s.logs = s.logs
          .filter((l) => !(l.source === "health" && l.date === day()))
          .concat(
            imported.map((l) => ({ ...l, source: "health", date: day() })),
          );
        if (segments.length) healthImport("sleep", segments);
        save();
        msg(
          imported.length +
            " registros importados. Si faltan datos, revisa tus permisos.",
        );
      } catch (e) {
        msg(e.message);
      }
    }

    async function signIn(action) {

          $("endpoint")?.value ||
          localStorage.veraHost ||
          (location.hostname !== "localhost" ? location.origin : "");
        if (!host)
          throw Error(
            "Introduce el enlace HTTPS del servidor de tu invitación.",
          );
        let u = new URL(host);
        if (
          u.protocol !== "https:" &&
          !["127.0.0.1", "localhost"].includes(u.hostname)
        )
          throw Error("Se necesita HTTPS.");
        let res = await fetch(u.origin + "/" + action, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: $("email").value,
            password: $("pass").value,
            notice: "beta-3",
            adult: !!$("adult")?.checked,
            invite: $("invite")?.value || "",
          }),
        });
        let data = await res.json();
        if (!res.ok) throw Error(data.error);
        localStorage.veraHost = u.origin;
        sessionStorage.veraToken = data.token;
        sessionStorage.veraUser = u.origin + "/" + data.id;
        s =
          JSON.parse(localStorage.getItem(storageKey()) || "null") || initial();
        s.endpoint = u.origin;

        !Number.isFinite(minutes) ||
        minutes <= 0 ||
        end > Date.now() + 60000 ||
        end - start > 86400000
      ) {
        msg("Comprueba las horas y el tiempo despierto.");
        return;
      }
      if (
        s.logs.some((l) => l.start < end && l.end > start && l.kind === "Sueño")

    function readiness() {
      let rows = s.logs.filter((l) => l.kind === "Sueño" && l.date === day());
      let manual = rows.filter((l) => l.source !== "health");
      let used = manual.length ? manual : rows;
      const h = used.reduce((n, l) => n + (+l.value || 0), 0),
        check = s.logs
          .filter(
            (l) =>
              l.date === day() &&
              l.group &&
              ["Sueño", "Sensaciones"].includes(l.kind),
          )
          .at(-1);
      if (!h) return { text: "Aún falta registrar el sueño de hoy." };
      let text =
        h.toFixed(1) + " h registradas · objetivo " + (s.need || 8) + " h. ";
      if (!check)
        return {
          hours: h,
          text:
            text +
            "Faltan sensaciones del grupo muscular para valorar la sesión.",
        };
      let recent = s.logs.filter(
        (l) =>
          l.exercise &&
          l.group?.toLowerCase() === check.group.toLowerCase() &&
          l.date >= day(new Date(Date.now() - 2 * 86400000)),
      );
      const caution =
        h < (s.need || 8) - 1 ||
        check.sore >= 6 ||
        check.tired >= 6 ||
        recent.some((l) => +l.effort >= 8 && check.sore >= 4);
      return {
        hours: h,
        group: check.group,
        text:
          text +
          check.group +
          " · agujetas " +
          check.sore +
          "/10, fatiga " +
          check.tired +
          "/10, " +
          recent.length +
          " ejercicios recientes registrados. " +
          (caution
            ? "Revisa la carga prevista antes de empezar."
            : "Los datos declarados permiten probar el calentamiento y reevaluar."),
      };

    function healthImport(type, rows) {
      const date = day(),
        source = "health";
      let entries = [];
      if (type === "steps")
        entries = rows.map((value) => ({
          kind: "Pasos",
          value,
          note: "Total del sistema",
        }));
      if (type === "workouts")
        entries = rows.map((t) => ({
          kind: "Entrenamiento",
          note: "Sesión importada · " + t,
        }));
      if (type === "sleep") {
        let spans = [];
        for (const [a, b, awake] of rows) {
          let p = a;
          for (const [x, y] of awake.sort((l, r) => l[0] - r[0])) {
            if (x > p) spans.push([p, Math.min(x, b)]);
            p = Math.max(p, y);
          }
          if (b > p) spans.push([p, b]);
        }
        let total = 0,
          last = 0;
        for (const [a, b] of spans.sort((x, y) => x[0] - y[0])) {
          total += Math.max(0, b - Math.max(last, a));
          last = Math.max(last, b);
        }
        if (total)
          entries = [
            {
              kind: "Sueño",
              value: total / 3600000,
              note: "Sesiones terminadas hoy · duración menos vigilia identificada",
            },
          ];
      }
      s.logs = s.logs
        .filter(
          (l) =>
            !(
              l.source === source &&
              l.date === date &&
              l.kind ===
                { steps: "Pasos", workouts: "Entrenamiento", sleep: "Sueño" }[
                  type
                ]
            ),
        )
        .concat(entries.map((l) => ({ ...l, date, source })));
      save();
      msg("Datos de salud actualizados.");
    }

    function recordFor(l) {
      if (!l.exercise || !l.reps?.length) return "";
      const prior = s.logs.filter(
        (p) =>
          p !== l &&
          p.date <= l.date &&
          s.logs.indexOf(p) < s.logs.indexOf(l) &&
          comparable(p) === comparable(l) &&
          p.reps?.length,
      );
      if (!prior.length) return "Primera referencia";
      const reps = Math.max(...l.reps),
        same = prior.filter((p) => p.kg === l.kg);
      if (
        same.length &&
        reps > Math.max(...same.map((p) => Math.max(...p.reps)))
      )
        return "Récord de repeticiones a igual carga";
      let matched = prior.filter((p) => Math.max(...p.reps) === reps);
      if (
        matched.length &&
        (l.mode === "Asistencia"
          ? l.kg < Math.min(...matched.map((p) => p.kg))
          : l.kg > Math.max(...matched.map((p) => p.kg)))
      )
        return l.mode === "Asistencia"
          ? "Menor asistencia a repeticiones comparables"
          : "Récord de carga a repeticiones comparables";
      return "";
    }

    }
    function manualMachine() {
      machineDraft = {};
      showMachine();
    }
    function showMachine() {
      let d = machineDraft;
      $("machineResult").innerHTML =
        "<p>" +
        safe(d.evidence) +
        " " +
        safe(d.uncertainty) +
        "</p>" +
        [
          ["type", "Tipo de máquina"],
          ["brand", "Marca (si se conoce)"],
          ["model", "Modelo (si se conoce)"],
          ["operation", "Funcionamiento"],
          ["fit", "Ajustes, comodidad y límites"],
          ["muscles", "Músculos implicados"],
        ]
          .map(([k, l]) => field("m_" + k, l, d[k] || ""))
          .join("") +
        btn("Confirmar y guardar en este gimnasio", "keepMachine()", true);
    }
    function keepMachine() {
      let gym = $("gymNow").value.trim();
      if (!gym || !$("m_type").value.trim())
        return msg("Indica gimnasio y tipo de máquina.");
      const m = { ...machineDraft, id: uid(), gym };
      for (let k of ["type", "brand", "model", "operation", "fit", "muscles"])
        m[k] = $("m_" + k).value.trim();
      s.gym = gym;
      (s.machines ??= []).push(m);
      save();
      go("Máquinas");
      msg("Máquina guardada.");
    }
    function trainMachine(i) {
      let m = s.machines[i];
      kind = "Entrenamiento";
      s.gym = m.gym;
      save();
      go("Registro");
      $("exercise").value = m.type;
      $("machine").value = [m.brand, m.model, m.id].filter(Boolean).join(" · ");
      $("group").value = m.muscles || "";
    }
    function compareMachines() {
      let a = s.machines[$("m1").value],
        b = s.machines[$("m2").value];
      if (a === b) return msg("Elige dos máquinas distintas.");
      ask(
        "Compara funcionamiento, ajustes, comodidad, musculatura y progreso de estas dos máquinas según sus fichas y mis series. Indica qué falta para recomendar una. No atribuyas hipertrofia a la foto. " +
          JSON.stringify([a, b]),
      );
    }
    function greeting() {
      return '<div class="welcome"><div class="emblem">V</div><h1>¿Cómo entrenamos hoy?</h1><p>Cuéntame qué buscas, qué has hecho hoy o cómo te encuentras. Vamos paso a paso.</p></div>';
    }
    function convo() {
      const body = chatPage();
      return (
        (!s.turns.length ? greeting() : "") +
        body
          .replace(
            "<section><label>Habla con Vera",
            '<section class="composer"><label>Habla con Vera',
          )
          .replace("¿Qué carga intento hoy?", "Cuéntaselo a Vera…")
          .replace("Dictar mensaje", "Micrófono")
          .replace("Enviar</button>", "Enviar ↑</button>") +
        (introDraft
          ? "<section><h3>¿Lo he entendido bien?</h3><p>" +
            safe(introDraft.reply) +
            "</p><p>" +
            safe(
              Object.entries(introDraft.profile || {})
                .filter(([, v]) => v)
                .map(
                  ([k, v]) =>
                    (({
                      name: "Nombre",
                      goal: "Objetivo",
                      criteria: "Entrenamiento",
                      likes: "Preferencias",
                      age: "Edad",
                      height: "Altura",
                      weight: "Peso",
                    })[k] || k) +
                    " · " +
                    v,
                )
                .join(" / "),
            ) +
            "</p>" +
            btn("Guardar y continuar", "confirmIntro()", true) +
            btn("Corregir", "correctIntro()") +
            "</section>"
          : "")
      );
    }
    function correctIntro() {
      const previous = introDraft.original;
      introDraft = null;
      render();
      $("question").value = previous;
      $("question").focus();
    }
    function confirmIntro() {
      for (let [k, v] of Object.entries(introDraft.profile || {}))
        if (
          [
            "name",
            "goal",
            "criteria",
            "likes",
            "age",
            "height",
            "weight",
          ].includes(k) &&
          v
        )
          s.profile[k] = String(v);
      s.profile.introduced = true;
      s.turns.push({
        date: day(),
        question: introDraft.original,
        answer: introDraft.reply,
        reports: [],
      });
      introDraft = null;
      save();
      go("Chat");
    }
    async function intro(text) {
      busy = true;
      try {
        let d;
        try {
          d = await api("intro", { message: text, profile: s.profile });
        } catch (e) {
          if (!/todavía no está activado/.test(e.message)) throw e;
          d = {
            profile: { criteria: text },
            reply:
              "He apuntado tus palabras como contexto de entrenamiento. Podrás ampliarlas desde el chat cuando se active la IA.",
          };
        }
        introDraft = { ...d, original: text };
        render();
        msg("Revisa lo que Vera propone guardar.");
      } catch (e) {
        msg(e.message);
      } finally {
        busy = false;
      }
    }
    async function verifySession() {
      if (!sessionStorage.veraToken) return;
      try {
        await api("session", {});
        validSession = true;
        tab = "Chat";
        render();
      } catch (e) {
        msg(e.message);
      }
    }

    render();
    verifySession();
  </script>
</html>
